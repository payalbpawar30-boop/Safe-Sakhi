services:
  mongodb:
    image: mongo:8
    container_name: safe-sakhi-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
  backend:
    build: ./backend
    container_name: safe-sakhi-backend
    ports:
      - "5000:5000"
    environment:
      MONGO_URI: mongodb://mongodb:27017/safe_sakhi
    depends_on:
      - mongodb
  frontend:
    build: ./frontend
    container_name: safe-sakhi-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
volumes:
  mongodb_data: